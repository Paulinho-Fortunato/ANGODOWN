<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download pronto - AngoDown</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 8px;
        }
        .filename {
            color: #a0a0a0;
            margin-bottom: 24px;
            word-break: break-all;
            font-size: 14px;
        }
        .download-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 12px;
        }
        .download-btn:active {
            background: #4338ca;
        }
        .hint {
            color: #a0a0a0;
            font-size: 12px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">&#127925;</div>
        <h1>Download pronto</h1>
        <p class="filename">{{ filename }}</p>
        <a href="{{ filepath }}" download="{{ filename }}" class="download-btn">
            Baixar agora
        </a>
        <p class="hint">Toque no botão acima para salvar o arquivo</p>
    </div>
    <script>
        var link = document.querySelector('.download-btn');
        setTimeout(function() {
            link.click();
        }, 500);
    </script>
</body>
</html>
